[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prime-number"
version = "0.1.0"
description = "Two from-scratch primality-check approaches (trial division and known-primes) with tests and a CLI."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==8.3.3"]
legacy = ["numpy==2.1.3", "pandas==2.2.3", "matplotlib==3.9.2"]

[project.scripts]
prime-check = "prime_checker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
